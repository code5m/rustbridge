[package]
name = "rustbridge"
version = "0.5.0"
edition = "2024"
description = "A lightweight Rust IDE that teaches Rust through Java 8 mental models"
license = "MIT"
repository = "https://github.com/code5m/rustbridge"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
glow = "0.16"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
rfd = "0.15"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
